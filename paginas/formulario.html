<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/mediaQuerry.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
    <header>
        <div class="cabecalho">
            <div class="logo">
                <img src="/imagens/logo.png" alt="Logo">
            </div>
            <div class="slogan">
                <h2>Cadastro de Usuário</h2>
                <p>Preencha o formulário abaixo para se cadastrar em nosso site.</p>
            </div>
            <nav>
                <div class="linkForm"><a href="/index.html">Home</a></div>
            </nav>
        </div>
    </header>
    <main>
        <form class="formulario">
            <section>
                <div class="linhaCampo">
                    <label for="nome">Nome:</label>
                    <input class="campo" type="text" id="nome" name="nome" required minlength="3" 
                            oninvalid="this.setCustomValidity('Digite seu nome')"
                            oninput="this.setCustomValidity('')">
                </div>
            </section>

            <section>
                <div class="linhaCampo">
                    <labeL for="idade">Idade:</labeL>
                    <input class="campo" type="number" id="idade" name="idade" required min="18" max="60"
                            oninvalid="this.setCustomValidity('Digite uma idade entre 18 e 60 anos')"
                            oninput="this.setCustomValidity('')">
                </div>
            </section>

            <section>
                <div class="linhaCampo">
                <label for="email">Email:</label>
                    <input class="campo" type="email" id="email" name="email" required
                            oninvalid="this.setCustomValidity('Digite um email válido')"
                            oninput="this.setCustomValidity('')">
                </div>
            </section>

            <section>
                <div class="linhaCampo">
                    <label for="telefone">Telefone:</label>
                    <input class="campo" type="tel" id="telefone" name="telefone" required 
                        pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" placeholder="XX-XXXXX-XXXX"
                        oninvalid="this.setCustomValidity('Digite seu telefone')"
                        oninput="this.setCustomValidity('')">
                </div>
            </section>

            <section>
                <div class="linhaCampo">
                    <label for="cep">CEP:</label>
                    <input class="campo" type="text" id="cep" name="cep" required 
                            pattern="[0-9]{5}-[0-9]{3}" placeholder="XXXXX-XXX"
                            oninvalid="this.setCustomValidity('Digite um CEP válido')"
                            oninput="this.setCustomValidity('')">
                </div>
            </section>

            <section>
                <div class="linhaCampo">
                    <label for="senha">Senha:</label>
                    <input class="campo" type="password" id="senha" required minlength="6"
                            oninvalid="this.setCustomValidity('Digite uma senha com pelo menos 6 caracteres')"
                            oninput="this.setCustomValidity('')">
                </div>
            </section>

            <section>
                <div>
                    <label for="dataNascimento">Data de Nascimento:</label>
                    <input class="campoDataNascimento" type="date" id="dataNascimento" name="dataNascimento" required>
                </div>
            </section>

            <section class="form-genero">
                <label for="genero">Gênero:</label>
                <input type="radio" id="genero" name="genero" value="masculino" required>
                <label for="genero">Masculino</label>
                <input type="radio" id="genero" name="genero" value="feminino" required>
                <label for="genero">Feminino</label>
                <input type="radio" id="genero" name="genero" value="outro" required>
                <label for="genero">Outro</label>
            </section>
            
            <section>
                <label for="perfilCliente">Perfil do Cliente:</label>
                <textarea id="perfilCliente" name="perfilCliente" rows="4" cols="50" placeholder="Descreva seu perfil como cliente..."></textarea>
            </section>

            <section>
                <label for="tipoCarro">Tipo de carro:</label>
                <select id="tipoCarro" name="tipoCarro">
                    <option value="" disabled selected>Selecione um tipo de carro</option>
                    <option value="sedan">Sedan</option>
                    <option value="suv">SUV</option>
                    <option value="hatch">Hatch</option>
                    <option value="crossover">Crossover</option>
                    <option value="pickup">Pickup</option>
                </select>
            </section>

            <section class="form-interesse">
                <label for="interesses">Interesses:</label>
                <input type="checkbox" id="interesses" name="interesses" value="compra">
                <label for="interesses">Compra de Carro</label>
                <input type="checkbox" id="interesses" name="interesses" value="aluguel">
                <label for="interesses">Aluguel de Carro</label>
            </section>

            <section>
                <input type="submit" class="botao" value="Cadastrar">
            </section>
        </form>
    </main>

    

    <footer>
        <div class="contatos">
            <p><strong>Contatos</strong></p>
            <p>contato@primeseminovos.com.br</p>
            <p>Telefone: (27) 1234-5678</p>
        </div>
        <p class="copy">&copy; 2026 Prime Seminovos. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
